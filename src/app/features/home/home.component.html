<div class="container">
  <h2>Catàleg complet ({{ items.length }} elements)</h2>

  <!-- Loading -->
  <div *ngIf="loading" class="loading">Carregant elements...</div>

  <!-- Error -->
  <div *ngIf="error" class="error">{{ error }}</div>

  <!-- LLISTAT AMB SCROLL VIRTUAL -->
  <!-- Recorda que 'viewport' ha de tenir height definit al CSS (ex: 80vh) -->
  <cdk-virtual-scroll-viewport *ngIf="!loading && !error" itemSize="250" class="viewport">
    
    <!-- Iterem amb cdkVirtualFor en lloc de ngFor -->
    <div *cdkVirtualFor="let item of items; trackBy: trackByPeliculaId" class="item-wrapper">
      
      <!-- Utilitzem el component presentacional (OnPush) que hem creat -->
      <app-pelicula-card 
        [pelicula]="item" 
        (cardClick)="viewDetail($event)">
      </app-pelicula-card>

    </div>

  </cdk-virtual-scroll-viewport>
</div>
